<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Steapex Marketing OS</title>
<meta name="description" content="Marketing OS ของทีม Steapex: งาน แคมเปญ คอนเทนต์ LIVE Affiliate ประชุม และข่าวตลาด ในที่เดียว">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<script>
/* ค่าเริ่มต้น = โหมดมืด (ตามที่เลือกใน Blueprint) */
try{var t=localStorage.getItem('sos-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}
</script>
<style>
:root{
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-display:"Archivo","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:18px; --side:264px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0807; --bg2:#100B08; --panel:#15100C; --panel2:#1D1611; --sunk:#0E0A08;
  --line:rgba(255,140,70,.15); --line2:rgba(255,255,255,.07);
  --ink:#F7EFE9; --muted:#A8968A; --dim:#78685E;
  --accent:#F26B1D; --accent2:#FF9A4D; --accent-ink:#FFB27A; --accent-soft:rgba(242,107,29,.14);
  --ok:#3DD68C; --warn:#FFB547; --bad:#FF6464; --info:#64AEFF; --vio:#B48CFF;
  --glow:0 0 0 1px rgba(242,107,29,.6),0 14px 44px -14px rgba(242,107,29,.55);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#FFF8F2; --bg2:#FFF3EA; --panel:#FFFFFF; --panel2:#FFF5EE; --sunk:#FFEDE0;
  --line:#F3D8C4; --line2:#F2E6DC;
  --ink:#24140A; --muted:#7B5B45; --dim:#A58A76;
  --accent:#D9480F; --accent2:#F26B1D; --accent-ink:#B23A0A; --accent-soft:#FFE6D3;
  --ok:#1F9D62; --warn:#B7791F; --bad:#C53030; --info:#2B6CB0; --vio:#6B46C1;
  --glow:0 0 0 1px rgba(217,72,15,.45),0 12px 34px -14px rgba(217,72,15,.45);
  --shadow:0 1px 2px rgba(122,42,5,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.25}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.app.collapsed{--side:76px}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg2);border-right:1px solid var(--line2);padding:16px 12px 24px;display:flex;flex-direction:column;gap:6px;z-index:30}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 14px;border-bottom:1px solid var(--line2);margin-bottom:6px}
.brand img{width:36px;height:36px;border-radius:10px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.brand .bt{min-width:0;flex:1}
.brand b{display:block;font-family:var(--f-display);font-weight:800;letter-spacing:.06em;font-size:15px}
.brand small{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.ver{font-family:var(--f-mono);font-size:11px;color:var(--ok);background:rgba(61,214,140,.12);border-radius:999px;padding:1px 8px}
.collapse-btn{margin-left:auto}
.ng{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--dim);padding:14px 10px 6px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:9px 10px;color:var(--muted);font-size:14px;font-weight:500;text-decoration:none}
.ni:hover{background:var(--panel2);color:var(--ink)}
.ni[aria-current="page"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.ni svg{flex:none;opacity:.9}
.ni .num{font-family:var(--f-mono);font-size:11px;color:var(--dim);width:18px;flex:none}
.ni .nb{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;line-height:18px}
.app.collapsed .ni .lbl,.app.collapsed .ni .num,.app.collapsed .ng,.app.collapsed .brand .bt,.app.collapsed .ver{display:none}
.app.collapsed .ni{justify-content:center}
.app.collapsed .brand{flex-direction:column}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line2)}
.top-in{display:flex;align-items:center;gap:12px;padding:12px 24px;flex-wrap:wrap}
.ttl{min-width:0;flex:1 1 220px}
.eyebrow{margin:0;font-size:12px;color:var(--muted);letter-spacing:.04em}
.ttl h1{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;flex:0 1 340px;min-width:180px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:9px 14px 9px 38px;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.qres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.35);max-height:380px;overflow:auto;padding:6px;z-index:40}
.qres button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 10px}
.qres button:hover{background:var(--panel2)}
.qres small{color:var(--muted)}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;padding:0;color:var(--ink)}
.icon-btn:hover{border-color:var(--accent)}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-family:var(--f-mono);display:grid;place-items:center;padding:0 5px}
.who{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:4px 6px 4px 12px;font-size:12.5px;color:var(--muted)}
.who select{background:transparent;border:0;color:var(--ink);font-weight:600;outline:none;max-width:170px}
.who select option{background:var(--panel)}
.menu-btn{display:none}
.demo{margin:14px 24px 0;font-size:12.5px;color:var(--muted);background:var(--accent-soft);border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);border-radius:12px;padding:8px 12px}
.demo b{color:var(--ink)}
#view{padding:20px 24px 64px;min-width:0}
#view:focus{outline:none}
.bellpanel{position:absolute;right:0;top:calc(100% + 8px);width:min(360px,86vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.4);padding:8px;z-index:40;max-height:70vh;overflow:auto;text-align:left}
.bellwrap{position:relative}

/* ---------- Building blocks ---------- */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;grid-auto-flow:dense}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
@media (max-width:1100px){.s3{grid-column:span 6}.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
@media (max-width:620px){.s3{grid-column:span 12}}
.card{background:linear-gradient(180deg,var(--panel),var(--panel) 60%,var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.hot{box-shadow:var(--glow)}
.card h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:12.5px;margin:2px 0 12px}
.ch{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.ch .sp{flex:1}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--dim)}
.kpi .v.ac{color:var(--accent2)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 13px;font-weight:600;font-size:13.5px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:transparent}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 55%,transparent)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 9px;line-height:20px;white-space:nowrap;background:var(--panel2);color:var(--muted);border:1px solid var(--line2)}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);border-color:transparent}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);border-color:transparent}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent);border-color:transparent}
.pill.info{color:var(--info);background:color-mix(in srgb,var(--info) 13%,transparent);border-color:transparent}
.pill.ac{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent}
.pill.vio{color:var(--vio);background:color-mix(in srgb,var(--vio) 14%,transparent);border-color:transparent}
.ndot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:7px}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#1a0d05;flex:none;border:2px solid var(--panel)}
.avs{display:inline-flex}.avs .av+.av{margin-left:-8px}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;border:1px solid var(--line2)}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.bar.ok i{background:var(--ok)}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.mono{font-family:var(--f-mono)}
.small{font-size:12.5px}
.empty{color:var(--muted);text-align:center;padding:22px;border:1px dashed var(--line);border-radius:14px;font-size:13.5px}
.list{list-style:none;margin:0;padding:0}
.list>li{padding:10px 0;border-top:1px solid var(--line2);display:flex;gap:10px;align-items:flex-start}
.list>li:first-child{border-top:0}
.list .t{font-weight:600}
.list .m{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.click{cursor:pointer}
.click:hover .t{color:var(--accent-ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.note{font-size:12.5px;color:var(--muted);background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px}
.note b{color:var(--ink)}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:top}
.tb tr.click:hover td{background:var(--panel2)}
.tb .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}

/* Donut */
.donut{--p:0;width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.donut::before{content:"";grid-area:1/1;width:96px;height:96px;border-radius:50%;background:var(--panel)}
.donut b{grid-area:1/1;font-family:var(--f-display);font-size:26px;font-weight:800;z-index:1}
.legend{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* Kanban */
.board{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(205px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:10px;min-height:200px;display:flex;flex-direction:column;gap:9px}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.kgrid{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(220px,1fr);gap:16px;grid-column:span 12}
.kstack{display:grid;gap:16px}
.kstack .kpi .v{font-size:30px}
@media (max-width:900px){.kgrid{grid-template-columns:minmax(0,1fr)}.kstack{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.kstack{grid-template-columns:minmax(0,1fr)}}
.pg{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.pg .big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;color:var(--accent2);font-variant-numeric:tabular-nums}
.sdonut{width:var(--sz,170px);height:var(--sz,170px);border-radius:50%;display:grid;place-items:center;flex:none}
.sdonut::before{content:"";grid-area:1/1;width:68%;height:68%;border-radius:50%;background:var(--panel)}
.sdonut .ctr{grid-area:1/1;z-index:1;text-align:center;line-height:1.1}
.sdonut .ctr b{display:block;font-family:var(--f-display);font-size:30px;font-weight:800}
.sdonut .ctr small{font-size:11.5px;color:var(--muted)}
.sleg{display:grid;gap:7px;font-size:13.5px}
.sleg span{display:flex;align-items:center;gap:8px}
.sleg i{width:12px;height:12px;border-radius:4px;flex:none}
.sleg b{margin-left:auto;font-family:var(--f-mono);padding-left:14px}
.colh{display:flex;align-items:center;gap:8px;background:var(--c);color:var(--ct);border-radius:12px;padding:10px 12px;margin-bottom:2px}
.colh .th{display:block;font-size:16.5px;font-weight:800;letter-spacing:.01em;line-height:1.25;white-space:nowrap}
.colh .en{display:block;font-size:11.5px;font-weight:600;opacity:.85}
.colh .n{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;font-weight:700;background:rgba(255,255,255,.25);border-radius:999px;padding:1px 9px}
.col[data-st]{border-top:3px solid var(--c)}
.promo{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel2)}
.promo table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.promo th{text-align:left;color:var(--dim);font-weight:700;font-size:11px;padding:4px 6px;border-bottom:1px solid var(--line2)}
.promo td{padding:5px 6px;border-bottom:1px solid var(--line2)}
.promo .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.col h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;padding:4px 4px 2px;font-family:var(--f-body)}
.col h3 .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--panel);border-radius:999px;padding:0 7px}
.tc{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 12px;cursor:grab;display:grid;gap:7px}
.tc:hover{border-color:var(--accent)}
.tc .t{font-weight:600;font-size:14px;line-height:1.4}
.tc .m{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;color:var(--muted)}
.tc .ft{display:flex;align-items:center;gap:8px}
.prio{width:8px;height:8px;border-radius:50%;flex:none}
.p-high{background:var(--bad)}.p-med{background:var(--warn)}.p-low{background:var(--info)}
.sub-l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}

/* Calendar */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.mgrid .dh{font-size:11.5px;font-weight:700;color:var(--dim);padding:8px;text-align:center;background:var(--bg2);border-bottom:1px solid var(--line2)}
.mgrid .dc{min-height:112px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:6px;display:flex;flex-direction:column;gap:3px;background:var(--panel);min-width:0}
.mgrid .dc:nth-child(7n){border-right:0}
.mgrid .dc.out{background:var(--bg2);opacity:.6}
.mgrid .dc.today{box-shadow:inset 0 0 0 2px var(--accent)}
.mgrid .dn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ev{font-size:11.5px;border-radius:6px;padding:2px 6px;background:var(--panel2);border-left:3px solid var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--ink);text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.ev.t-task{border-left-color:var(--info)}.ev.t-content{border-left-color:var(--vio)}.ev.t-live{border-left-color:var(--bad)}.ev.t-event{border-left-color:var(--ok)}.ev.t-campaign{border-left-color:var(--warn)}
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto}
.wday{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:10px;min-height:260px;display:flex;flex-direction:column;gap:6px}
.wday.today{border-color:var(--accent);box-shadow:var(--glow)}
.wday h4{margin:0 0 4px;font-size:12.5px;color:var(--muted);font-weight:600}
.wday h4 b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink)}
.ev .tm{font-family:var(--f-mono);color:var(--muted);margin-right:4px}
.lg-row{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.lg-row i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* Goals tree */
.goal{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel)}
.goal .lv{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.goal .t{font-weight:700;margin:2px 0}
.goal-kids{margin:10px 0 0 18px;padding-left:14px;border-left:2px solid var(--line);display:grid;gap:10px}

/* Charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chart .gl{stroke:var(--line2)}
.chart .br{fill:url(#gBar)}
.chart .br:hover{fill:var(--accent2)}
.hb{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;min-width:0}

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('บันทึกในเบราว์เซอร์ไม่ได้ (พื้นที่เก็บข้อมูลถูกปิด)')}}

function monthProgress(){const T=today();const d=new Date(T+'T00:00:00');const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return Math.round(d.getDate()/dim*100)}

/* ---------------- Workflow (Task ↔ Approval) ---------------- */
function logTask(t,text){t.history.unshift({who:ME,t:new Date().toISOString(),text})}
function blockedBy(t){return (t.dependsOn||[]).map(taskById).filter(d=>d&&d.status!=='done')}
function setTaskStatus(t,st){
  if(!t||t.status===st)return;
  if((st==='doing'||st==='review'||st==='done')&&blockedBy(t).length){toast('ยังเริ่มไม่ได้: รอ “'+blockedBy(t)[0].title+'” เสร็จก่อน');return}
  const old=t.status;t.status=st;logTask(t,`เปลี่ยนสถานะ ${TST[old][2]} → ${TST[st][2]}`);
  if(st==='review'){S.approvals.unshift({id:uid(),kind:'task',ref:t.id,title:t.title,requestedBy:ME,reviewer:t.reviewer||S.users.find(u=>u.role==='sup')?.id||'',status:'pending',date:today(),comment:''});commit(`ส่งงาน “${t.title}” เข้ารอตรวจ`);return}
  if(old==='review')S.approvals.filter(a=>a.kind==='task'&&a.ref===t.id&&a.status==='pending').forEach(a=>{a.status='withdrawn'});
  commit(`ย้ายงาน “${t.title}” ไป ${TST[st][2]}`);
}
function decide(apId,decision,comment){
  const a=S.approvals.find(x=>x.id===apId);if(!a)return;
  if(!isSup()&&a.reviewer!==ME){toast('เฉพาะผู้ตรวจหรือ Supervisor เท่านั้นที่อนุมัติได้');return}
  a.status=decision;a.comment=comment||'';a.decidedAt=new Date().toISOString();a.decidedBy=ME;
  if(a.kind==='task'){const t=taskById(a.ref);if(t){t.status=decision==='approved'?'done':'revision';logTask(t,decision==='approved'?'อนุมัติแล้ว':'ขอให้แก้ไข'+(comment?': '+comment:''));if(comment)t.comments.push({who:ME,t:new Date().toISOString(),text:comment})}}
  if(a.kind==='content'){const c=S.contents.find(x=>x.id===a.ref);if(c)c.status=decision==='approved'?'scheduled':'production'}
  commit(`${decision==='approved'?'อนุมัติ':'ขอให้แก้ไข'} “${a.title}”`);
}

/* ---------------- Forms ---------------- */
function fieldHtml(f,v){
  const req=f.req?'required':'',lab=`<span>${esc(f.label)}${f.req?' *':''}</span>`,hint=f.hint?`<span class="hint">${esc(f.hint)}</span>`:'',w=f.wide?' w':'';
  if(f.type==='select')return `<label class="f${w}">${lab}<select name="${f.k}" ${req}>${f.options.map(([val,l])=>`<option value="${esc(val)}" ${String(v??'')===String(val)?'selected':''}>${esc(l)}</option>`).join('')}</select>${hint}</label>`;
  if(f.type==='multi'){const vs=v||[];return `<div class="f${w}">${lab}<div class="chk">${f.options.map(([val,l])=>`<label><input type="checkbox" name="${f.k}" value="${esc(val)}" ${vs.includes(val)?'checked':''}> ${esc(l)}</label>`).join('')||'<span class="dim">ไม่มีตัวเลือก</span>'}</div>${hint}</div>`}
  if(['textarea','lines','kpis','checklist','promos'].includes(f.type)){let val=v;
    if(f.type==='lines')val=(v||[]).join('\n');if(f.type==='kpis')val=(v||[]).map(k=>`${k.label} | ${k.target} | ${k.actual}`).join('\n');if(f.type==='checklist')val=(v||[]).map(c=>(c.done?'[x] ':'')+c.t).join('\n');if(f.type==='promos')val=(v||[]).map(p=>`${p.name} | ${p.type==='gift'?'ของแถม':'ส่วนลด'} | ${p.qty} | ${p.unit}`).join('\n');
    return `<label class="f w">${lab}<textarea name="${f.k}" ${req} rows="${f.rows||4}">${esc(val??'')}</textarea>${hint}</label>`}
  return `<label class="f${w}">${lab}<input name="${f.k}" type="${f.type||'text'}" value="${esc(v??'')}" ${req} ${f.type==='number'?'step="any" min="0"':''}>${hint}</label>`;
}
function collect(fields,form){
  const o={};for(const f of fields){
    if(f.type==='multi'){o[f.k]=[...form.querySelectorAll(`[name="${f.k}"]:checked`)].map(x=>x.value);continue}
    const el=form.elements[f.k];let v=el?el.value:'';
    if(f.type==='number')v=v===''?0:Number(v);
    else if(f.type==='lines')v=v.split('\n').map(s=>s.trim()).filter(Boolean);
    else if(f.type==='kpis')v=v.split('\n').map(s=>s.split('|').map(x=>x.trim())).filter(a=>a[0]).map(a=>({label:a[0],target:Number(a[1])||0,actual:Number(a[2])||0}));
    else if(f.type==='checklist')v=v.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>({t:s.replace(/^\[(x|X| )\]\s*/,''),done:/^\[(x|X)\]/.test(s)}));
    else if(f.type==='promos')v=v.split('\n').map(x=>x.split('|').map(y=>y.trim())).filter(a=>a[0]).map(a=>({name:a[0],type:/แถม|gift/i.test(a[1]||'')?'gift':'discount',qty:Number(String(a[2]||'').replace(/,/g,''))||0,unit:Number(String(a[3]||'').replace(/,/g,''))||0}));
    else v=String(v).trim();
    o[f.k]=v}
  return o;
}
function openForm({title,fields,value={},onSave,onDelete,saveLabel='บันทึก'}){
  const d=$('#dlg');
  d.innerHTML=`<form class="fm" novalidate><header><h3>${esc(title)}</h3><button type="button" class="x" data-close aria-label="ปิด">×</button></header><div class="fgrid">${fields.map(f=>fieldHtml(f,value[f.k])).join('')}</div><footer>${onDelete?'<button type="button" class="btn danger" data-del>'+ic('trash',15)+' ลบ</button>':''}<span class="sp"></span><button type="button" class="btn ghost" data-close>ยกเลิก</button><button type="submit" class="btn primary">${esc(saveLabel)}</button></footer></form>`;
  const form=d.querySelector('form');
  form.addEventListener('submit',e=>{e.preventDefault();
    const miss=fields.filter(f=>f.req&&!String(form.elements[f.k]?.value||'').trim());
    if(miss.length){toast('กรุณากรอก: '+miss.map(f=>f.label).join(', '));form.elements[miss[0].k]?.focus();return}
    const v=collect(fields,form);d.close();onSave(v)});
  d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.close());
  if(onDelete)form.querySelector('[data-del]').onclick=()=>{if(confirm('ลบรายการนี้? (กู้คืนได้ที่ Settings → ข้อมูลและถังขยะ)')){d.close();onDelete()}};
  d.showModal();
}

/* ---------------- Helpers for views ---------------- */
function rangeBounds(r){const T=today();if(r==='today')return [T,T];if(r==='week'){const w=weekStart(T);return [w,addDays(w,6)]}
  const d=new Date(T+'T00:00:00');if(r==='month'){return [iso(new Date(d.getFullYear(),d.getMonth(),1)),iso(new Date(d.getFullYear(),d.getMonth()+1,0))]}
  const q=Math.floor(d.getMonth()/3)*3;return [iso(new Date(d.getFullYear(),q,1)),iso(new Date(d.getFullYear(),q+3,0))]}
const RANGE_L={today:'วันนี้',week:'สัปดาห์นี้',month:'เดือนนี้',quarter:'ไตรมาสนี้'};
function quotaStats(){const q=S.quota;if(!q)return null;const items=S.contents.filter(c=>(c.date||'').slice(0,7)===q.month);const done=items.filter(c=>['review','scheduled','published'].includes(c.status));
  const rows=q.pillars.map(p=>{const d=done.filter(c=>c.pillar===p.name).length;return {...p,done:d,left:Math.max(0,p.quota-d)}});return {rows,done:done.length,total:q.total||rows.reduce((a,b)=>a+b.quota,0)}}
function bars(data,{h=180,fmt=num}={}){
  if(!data.length)return '<div class="empty">ยังไม่มีข้อมูล</div>';
  const max=Math.max(...data.map(d=>d.v),1),every=Math.ceil(data.length/10);
  return `<div class="hb"><div class="hb-max small muted">สูงสุด ${esc(fmt(max))}</div><div class="hb-plot" style="height:${h}px">${data.map(d=>`<div class="hb-c" title="${esc(d.l)}: ${esc(fmt(d.v))}"><div class="hb-b" style="height:${Math.max(1.5,d.v/max*100)}%"></div></div>`).join('')}</div><div class="hb-x">${data.map((d,i)=>`<span>${i%every===0?esc(d.s||d.l):''}</span>`).join('')}</div></div>`;
}
function donut(p,label){return `<div class="donut" style="--p:${clamp(p,0,100)}" role="img" aria-label="${esc(label)} ${p}%"><b>${p}%</b></div>`}
const card=(id,title,body,{span='s6',sub='',hot=false,head=''}={})=>{const hidden=S.widgets.hidden.includes(id);if(hidden&&!UI.customize)return '';
  return `<section class="card ${span} ${hot?'hot':''} ${hidden?'whidden':''}" data-w="${id}"><div class="ch"><div><h2>${title}</h2>${sub?`<p class="sub" style="margin:2px 0 0">${sub}</p>`:''}</div><span class="sp"></span>${head}<span class="wbar"><button class="btn sm" data-act="w-up" data-id="${id}" aria-label="เลื่อนขึ้น">${ic('up',14)}</button><button class="btn sm" data-act="w-down" data-id="${id}" aria-label="เลื่อนลง">${ic('down',14)}</button><button class="btn sm" data-act="w-hide" data-id="${id}">${hidden?'แสดง':'ซ่อน'}</button></span></div>${body}</section>`};
function taskRow(t){const od=t.due&&t.due<today()&&t.status!=='done';return `<li class="click" data-act="task-open" data-id="${t.id}"><i class="prio p-${t.priority}" style="margin-top:8px"></i><div style="flex:1;min-width:0"><div class="t">${esc(t.title)}</div><div class="m"><span class="${od?'':'muted'}" style="${od?'color:var(--bad)':''}">${od?'เลยกำหนด ':'กำหนด '}${fd(t.due)}</span>${t.campaign?`<span>· ${esc(campName(t.campaign))}</span>`:''}</div></div>${stPill(t.status)}</li>`}

       <dl class="kv"><dt>งบประมาณ</dt><dd>${baht(e.budget)}</dd><dt>ทีมงาน</dt><dd>${esc(e.staff||'–')}</dd><dt>ซัพพลายเออร์</dt><dd>${esc(e.supplier||'–')}</dd>${e.campaign?`<dt>แคมเปญ</dt><dd>${esc(campName(e.campaign))}</dd>`:''}</dl>
       <div style="margin-top:12px"><div class="row small"><b>Checklist</b><span class="sp"></span><span class="mono">${done}/${e.checklist.length}</span></div><div class="bar ${done===e.checklist.length&&done?'ok':''}" style="margin:6px 0 8px"><i style="width:${pct(done,e.checklist.length)}%"></i></div>${e.checklist.map((c,i)=>`<label class="row small" style="padding:3px 0;cursor:pointer"><input type="checkbox" data-act="chk" data-id="${e.id}" data-i="${i}" ${c.done?'checked':''}> <span style="${c.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(c.t)}</span></label>`).join('')}</div>
       ${tks.length?`<div style="margin-top:10px"><b class="small">งานที่เกี่ยวข้อง</b><ul class="list">${tks.map(taskRow).join('')}</ul></div>`:''}<button class="btn sm" data-act="task-new" data-event="${e.id}" style="margin-top:10px">${ic('plus',13)} เพิ่มงานให้อีเวนต์นี้</button></section>`}).join('')||'<div class="empty s12">ยังไม่มีอีเวนต์</div>'}</div>`}
  return tabs+sum+`<div class="toolbar"><span class="sp"></span><button class="btn primary" data-act="camp-new">${ic('plus',15)} สร้างแคมเปญ</button></div><div class="grid">${S.campaigns.map(c=>{
    const tks=S.tasks.filter(t=>t.campaign===c.id),cts=S.contents.filter(x=>x.campaign===c.id),lvs=S.lives.filter(l=>l.campaign===c.id),afs=S.affiliates.filter(a=>a.campaign===c.id);const tp=clamp(pct(daysBetween(c.start,T),daysBetween(c.start,c.end)||1),0,100);
    return `<section class="card s6 ${c.status==='active'?'hot':''}"><div class="ch"><div><h2>${esc(c.name)}</h2><p class="sub" style="margin:2px 0 0">${fd(c.start)} – ${fdy(c.end)} · ดูแลโดย ${esc(user(c.owner).name)}</p></div><span class="sp"></span><span class="pill ${CAMP_ST[c.status][1]}">${CAMP_ST[c.status][0]}</span><button class="btn sm" data-act="camp-edit" data-id="${c.id}">${ic('edit',13)}</button></div>
     <div class="small muted">ระยะเวลาผ่านไป ${c.status==='planning'&&c.start>T?0:tp}%</div><div class="bar" style="margin:4px 0 10px"><i style="width:${c.status==='planning'&&c.start>T?0:tp}%"></i></div>
     ${c.brief?`<p class="small" style="margin:0 0 8px">${esc(c.brief)}</p>`:''}<dl class="kv small"><dt>กลุ่มเป้าหมาย</dt><dd>${esc(c.audience||'–')}</dd><dt>ช่องทาง</dt><dd>${(c.channels||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join(' ')||'–'}</dd><dt>งบประมาณ</dt><dd>${baht(c.spent)} / ${baht(c.budget)} <span class="muted">(${pct(c.spent,c.budget)}%)</span></dd>${c.goal?`<dt>เป้าหมาย</dt><dd>${esc((S.goals.find(g=>g.id===c.goal)||{}).title||'')}</dd>`:''}</dl>
     ${(c.kpis||[]).length?`<div style="margin-top:10px">${c.kpis.map(k=>`<div style="margin:6px 0"><div class="row small"><span>${esc(k.label)}</span><span class="sp"></span><span class="mono">${num(k.actual)} / ${num(k.target)}</span></div><div class="bar ${k.actual>=k.target&&k.target?'ok':''}" style="margin-top:3px"><i style="width:${clamp(pct(k.actual,k.target),0,100)}%"></i></div></div>`).join('')}</div>`:''}
     ${promoBox(c)}

     <div class="row" style="margin-top:10px"><button class="btn sm" data-act="task-new" data-camp="${c.id}">${ic('plus',13)} งาน</button><button class="btn sm" data-act="content-new" data-camp="${c.id}">${ic('plus',13)} คอนเทนต์</button></div></section>`}).join('')||'<div class="empty s12">ยังไม่มีแคมเปญ</div>'}</div>`;
}

/* ---------------- 05 Content ---------------- */

   <div class="tw"><table class="tb"><thead><tr><th>Pillar</th><th>บทบาท</th><th class="r">สัดส่วน</th><th class="r">Quota</th><th class="r">ผลิตแล้ว</th><th class="r">เหลือ</th><th style="min-width:160px">ความคืบหน้า</th></tr></thead><tbody>${q.rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.role)}</td><td class="r">${r.pct}%</td><td class="r">${r.quota}</td><td class="r">${r.done}</td><td class="r">${r.left||'<span style="color:var(--ok)">ครบ</span>'}</td><td><div class="bar ${r.done>=r.quota?'ok':''}"><i style="width:${pct(Math.min(r.done,r.quota),r.quota)}%"></i></div></td></tr>`).join('')}<tr><td><b>รวม</b></td><td></td><td class="r">${q.rows.reduce((a,r)=>a+(+r.pct||0),0)}%</td><td class="r"><b>${q.total}</b></td><td class="r"><b>${q.done}</b></td><td class="r"><b>${Math.max(0,q.total-q.done)}</b></td><td><div class="bar"><i style="width:${pct(Math.min(q.done,q.total),q.total)}%"></i></div></td></tr></tbody></table></div></section>`;
  const head=`<div class="toolbar"><div class="seg">${[['board','Production Board'],['calendar','Publishing Schedule'],['list','รายการ + Performance']].map(([k,l])=>`<button aria-pressed="${UI.contentView===k}" data-act="ctview" data-id="${k}">${l}</button>`).join('')}</div><span class="sp"></span><button class="btn primary" data-act="content-new">${ic('plus',15)} เพิ่มคอนเทนต์</button></div>`;
  const cc=c=>`<article class="tc" draggable="true" data-drag="content" data-id="${c.id}" data-act="content-edit" tabindex="0"><span class="t">${esc(c.title)}</span><div class="m"><span class="pill ac">${esc(c.pillar)}</span><span class="pill">${esc(c.platform)}</span><span>${esc(c.type)}</span></div><div class="ft">${av(c.owner)}<span class="sp"></span><span class="small muted">${fd(c.date)}</span></div></article>`;
  let body;
  if(UI.contentView==='calendar'){const s=weekStart(today());body=`<div class="wgrid">${[...Array(14).keys()].map(i=>{const x=addDays(s,i),its=S.contents.filter(c=>c.date===x);return `<div class="wday ${x===today()?'today':''}" style="min-height:180px"><h4>${new Intl.DateTimeFormat('th-TH',{weekday:'short'}).format(new Date(x+'T00:00:00'))}<b>${Number(x.slice(8))}</b></h4>${its.map(c=>`<button class="ev t-content" data-act="content-edit" data-id="${c.id}" title="${esc(c.title)}">${esc(c.platform)} · ${esc(c.title)}</button>`).join('')||'<span class="dim small">—</span>'}<button class="btn sm ghost" data-act="content-new" data-date="${x}" style="margin-top:auto">${ic('plus',13)}</button></div>`}).join('')}</div><p class="small muted">แสดง 2 สัปดาห์ (สัปดาห์นี้ + สัปดาห์หน้า)</p>`}
  else if(UI.contentView==='list'){const rows=S.contents.slice().sort((a,b)=>b.date.localeCompare(a.date));body=`<div class="card tw"><table class="tb"><thead><tr><th>คอนเทนต์</th><th>Pillar</th><th>แพลตฟอร์ม</th><th>สถานะ</th><th>ผู้รับผิดชอบ</th><th class="r">วันเผยแพร่</th><th class="r">ยอดวิว</th><th>ลิงก์</th></tr></thead><tbody>${rows.map(c=>`<tr class="click" data-act="content-edit" data-id="${c.id}"><td><b>${esc(c.title)}</b>${c.campaign?`<div class="small muted">${esc(campName(c.campaign))}</div>`:''}</td><td>${esc(c.pillar)}</td><td>${esc(c.platform)} · ${esc(c.type)}</td><td>${ctPill(c.status)}</td><td>${esc(user(c.owner).name)}</td><td class="r">${fd(c.date)}</td><td class="r">${c.views?num(c.views):'–'}</td><td>${c.link?`<a href="${esc(safeUrl(c.link))}" target="_blank" rel="noopener noreferrer" data-stop>เปิด ↗</a>`:'–'}</td></tr>`).join('')}</tbody></table></div><p class="small muted">ยอดวิวกรอกเองไปก่อน การดึงอัตโนมัติจาก TikTok ขึ้นกับสิทธิ์ API (Phase 3)</p>`}
  else body=`<p class="small muted" style="margin:-4px 0 12px">ลากการ์ดข้ามคอลัมน์เพื่อเปลี่ยนสถานะ · ย้ายเข้า “รออนุมัติ” = ส่งขออนุมัติให้ Supervisor</p><div class="board" style="--cols:6">${CT_ST.map(s=>{const cs=S.contents.filter(c=>c.status===s[0]).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="col" data-drop="content" data-st="${s[0]}"><h3><span class="pill ${s[2]}">${esc(s[1])}</span><span class="n">${cs.length}</span></h3>${cs.map(cc).join('')||'<p class="dim small" style="margin:6px">ว่าง</p>'}</div>`}).join('')}</div>`;
  return quota+head+body;
}

/* ---------------- 06 LIVE ---------------- */
function pLive(){
  const T=today(),days=UI.liveRange==='all'?99999:+UI.liveRange;const L=S.lives.filter(l=>daysBetween(l.date,T)<=days).sort((a,b)=>a.date.localeCompare(b.date));
  const sum=k=>L.reduce((a,l)=>a+(+l[k]||0),0);const mins=sum('durationMin'),gmv=sum('gmv'),orders=sum('orders'),clicks=sum('clicks'),views=sum('views');
  const by=(keyFn)=>{const m={};L.forEach(l=>{const k=keyFn(l);m[k]=m[k]||{k,n:0,gmv:0,orders:0,mins:0,views:0};m[k].n++;m[k].gmv+=+l.gmv||0;m[k].orders+=+l.orders||0;m[k].mins+=+l.durationMin||0;m[k].views+=+l.views||0});return Object.values(m).sort((a,b)=>b.gmv/(b.mins||1)-a.gmv/(a.mins||1))};
  const prod={};L.forEach(l=>String(l.products||'').split('\n').forEach(s=>{const p=s.split('|').map(x=>x.trim());if(p[0])prod[p[0]]=(prod[p[0]]||0)+(Number(p[1])||0)}));const topP=Object.entries(prod).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const kp=(k,v,d,hot)=>`<div class="card kpi ${hot?'hot':''}"><span class="k">${k}</span><span class="v ${hot?'ac':''}" style="font-size:26px">${v}</span><span class="d">${d}</span></div>`;
  const grp=(rows,label)=>`<div class="tw"><table class="tb"><thead><tr><th>${label}</th><th class="r">ครั้ง</th><th class="r">GMV</th><th class="r">GMV/ชั่วโมง</th><th class="r">ออเดอร์</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.k)}</b></td><td class="r">${r.n}</td><td class="r">${baht(r.gmv)}</td><td class="r">${baht(r.gmv/((r.mins||1)/60))}</td><td class="r">${num(r.orders)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">ไม่มีข้อมูล</td></tr>'}</tbody></table></div>`;
  return `<div class="toolbar"><div class="seg">${[['7','7 วัน'],['30','30 วัน'],['90','90 วัน'],['all','ทั้งหมด']].map(([k,l])=>`<button aria-pressed="${UI.liveRange===k}" data-act="lrange" data-id="${k}">${l}</button>`).join('')}</div><span class="sp"></span><button class="btn" data-act="ai-go" data-id="analyst">${ic('spark',15)} ให้ AI วิเคราะห์</button><button class="btn primary" data-act="live-new">${ic('plus',15)} บันทึกผล LIVE</button></div>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px">${kp('GMV',baht(gmv),`${L.length} ครั้ง`,1)}${kp('Orders',num(orders),`เฉลี่ย ${num(orders/(L.length||1))}/ครั้ง`)}${kp('LIVE Duration',num(mins/60)+' ชม.',`เฉลี่ย ${num(mins/(L.length||1))} นาที`)}${kp('LIVE Views',num(views),`Peak สูงสุด ${num(Math.max(0,...L.map(l=>l.peak||0)))}`)}${kp('Average Viewers',num(L.reduce((a,l)=>a+(+l.avgViewers||0),0)/(L.length||1)),'เฉลี่ยต่อครั้ง')}${kp('CTR',(views?(clicks/views*100).toFixed(1):0)+'%','Product clicks ÷ views')}${kp('Conversion',(clicks?(orders/clicks*100).toFixed(1):0)+'%','Orders ÷ product clicks')}</div>
   <div class="grid">
    ${card('l-trend','GMV รายครั้ง (เปรียบเทียบ LIVE แต่ละครั้ง)',bars(L.slice(-16).map(l=>({l:`${fd(l.date)} ${l.start} · ${l.host}`,s:fd(l.date),v:l.gmv})),{h:200,fmt:baht}),{span:'s8'})}
    ${card('l-prod','สินค้าขายดี',topP.length?`<ul class="list">${topP.map(([n,v],i)=>`<li><span class="mono muted" style="width:18px">${i+1}</span><span style="flex:1">${esc(n)}</span><b class="mono">${num(v)}</b></li>`).join('')}</ul>`:'<div class="empty">กรอกช่อง “สินค้าที่ขายได้” ในผล LIVE</div>',{span:'s4',sub:'รวมจำนวนออเดอร์ตามสินค้า'})}
    ${card('l-slot','ช่วงเวลาที่ขายดีที่สุด',grp(by(l=>(l.start||'??').slice(0,2)+':00 น.'),'ช่วงเวลาเริ่ม'),{span:'s6',sub:'เรียงตาม GMV ต่อชั่วโมง'})}
    ${card('l-host','เปรียบเทียบ Host',grp(by(l=>l.host||'ไม่ระบุ'),'Host'),{span:'s6',sub:'เรียงตาม GMV ต่อชั่วโมง'})}
    ${card('l-tbl','รายงานรายครั้ง',`<div class="tw"><table class="tb"><thead><tr><th>วันที่</th><th>Host</th><th class="r">นาที</th><th class="r">Views</th><th class="r">Peak</th><th class="r">Avg</th><th class="r">Clicks</th><th class="r">CTR</th><th class="r">Orders</th><th class="r">CVR</th><th class="r">GMV</th></tr></thead><tbody>${L.slice().reverse().map(l=>`<tr class="click" data-act="live-edit" data-id="${l.id}"><td>${fd(l.date)} <span class="muted mono small">${esc(l.start)}</span>${l.campaign?`<div class="small muted">${esc(campName(l.campaign))}</div>`:''}</td><td>${esc(l.host)}</td><td class="r">${num(l.durationMin)}</td><td class="r">${num(l.views)}</td><td class="r">${num(l.peak)}</td><td class="r">${num(l.avgViewers)}</td><td class="r">${num(l.clicks)}</td><td class="r">${l.views?(l.clicks/l.views*100).toFixed(1):0}%</td><td class="r">${num(l.orders)}</td><td class="r">${l.clicks?(l.orders/l.clicks*100).toFixed(1):0}%</td><td class="r"><b>${baht(l.gmv)}</b></td></tr>`).join('')||'<tr><td colspan="11" class="muted">ไม่มีข้อมูลในช่วงนี้</td></tr>'}</tbody></table></div>`,{span:'s12',sub:'คลิกแถวเพื่อแก้ไข · ข้อมูลตัวอย่าง ไม่ใช่ผลจริง'})}
   </div><p class="small muted">ตอนนี้กรอกผลเองหรือนำเข้าทีหลัง การดึงจาก TikTok Shop อัตโนมัติขึ้นกับสิทธิ์ API ของบัญชี (Phase 3)</p>`;
}

   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px">${kp('Total Revenue (GMV)',baht(gmv),`${act.length} คนที่กำลังโปรโมต`,1)}${kp('Orders',num(orders),'รวมทุกคน')}${kp('Product Clicks',num(clicks),'')}${kp('Conversion',(clicks?(orders/clicks*100).toFixed(1):0)+'%','Orders ÷ clicks')}${kp('AOV',baht(gmv/(orders||1)),'มูลค่าต่อออเดอร์')}${kp('Commission',baht(comm),'ประมาณการจาก % ที่ตั้งไว้')}</div>
   <div class="grid">

function aiContext(agent){const T=today(),brief=t=>`- [${TST[t.status][2]}] ${t.title} | ผู้รับผิดชอบ: ${t.assignees.map(a=>user(a).name).join(', ')} | กำหนด ${t.due}${t.campaign?' | แคมเปญ: '+campName(t.campaign):''}${blockedBy(t).length?' | รอ: '+blockedBy(t).map(x=>x.title).join(', '):''}`;
  const parts=[`วันนี้: ${T} · ทีม: ${S.workspace.name} · สมาชิก: ${S.users.map(u=>`${u.name} (${ROLES[u.role]||u.role})`).join(', ')}`];
  if(['daily','workflow','strategist'].includes(agent))parts.push('งานที่ยังไม่เสร็จ:\n'+S.tasks.filter(t=>t.status!=='done').map(brief).join('\n'),'รออนุมัติ:\n'+(S.approvals.filter(a=>a.status==='pending').map(a=>`- ${a.title} (ขอโดย ${user(a.requestedBy).name})`).join('\n')||'- ไม่มี'));

  if(agent==='analyst')parts.push('ผล LIVE (วันที่, เวลา, host, นาที, views, avg, clicks, orders, GMV):\n'+S.lives.map(l=>[l.date,l.start,l.host,l.durationMin,l.views,l.avgViewers,l.clicks,l.orders,l.gmv].join(', ')).join('\n'),'Affiliate (ชื่อ, ระดับ, สถานะ, วิดีโอ, clicks, orders, GMV, คอม%):\n'+S.affiliates.map(a=>[a.name,a.tier,a.status,a.videos,a.clicks,a.orders,a.gmv,a.commissionPct].join(', ')).join('\n'));

let dragId=null,dragKind=null;

/* top bar */
$('#bellBtn').addEventListener('click',()=>{const p=$('#bellPanel');if(!p.hidden){p.hidden=true;return}const N=notifs(),pend=S.approvals.filter(a=>a.status==='pending');
  p.innerHTML=`<div class="row" style="padding:6px 8px"><b style="flex:1">การแจ้งเตือน</b><button class="btn sm" data-go="notify">ดูทั้งหมด</button></div><ul class="list" style="padding:0 8px">${pend.length?`<li class="click" data-go="notify"><span class="pill warn">รออนุมัติ ${pend.length}</span></li>`:''}${N.slice(0,8).map(n=>`<li class="click" data-act="notif" data-id="${esc(n.id)}" data-go2="${n.go}" data-ref="${esc(n.ref||'')}"><span class="ndot" style="background:var(--${n.lv})"></span><div class="small" style="flex:1">${esc(n.text)}<div class="m">${esc(n.sub||'')}</div></div></li>`).join('')||'<li class="muted small">ไม่มี</li>'}</ul>`;p.hidden=false});
$('#themeBtn').innerHTML=ic('moon');
$('#themeBtn').addEventListener('click',()=>{const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('sos-theme',n)}catch(_){}});
$('#who').addEventListener('change',e=>{ME=e.target.value;try{localStorage.setItem('sos-me',ME)}catch(_){}toast('ใช้งานในชื่อ '+user(ME).name);render()});
$('#menuBtn').innerHTML=ic('menu');
$('#menuBtn').addEventListener('click',()=>{$('#app').classList.add('open');$('#scrim').hidden=false});
$('#scrim').addEventListener('click',()=>{$('#app').classList.remove('open');$('#scrim').hidden=true});
$('#collapseBtn').innerHTML=ic('side')+'<span class="lbl">ย่อเมนู</span>';
try{if(localStorage.getItem('sos-collapsed')==='1')$('#app').classList.add('collapsed')}catch(_){}
$('#collapseBtn').addEventListener('click',()=>{const c=$('#app').classList.toggle('collapsed');try{localStorage.setItem('sos-collapsed',c?'1':'0')}catch(_){}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==route&&MOD[h])go(h)});

save();
go((location.hash.slice(1)&&MOD[location.hash.slice(1)])?location.hash.slice(1):'overview');
</script>
</body>
</html>
