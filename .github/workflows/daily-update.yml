name: Daily news update

on:
  schedule:
    # 06:30 เวลาไทย (23:30 UTC ของวันก่อนหน้า) ทุกวัน
    - cron: "30 23 * * *"
  workflow_dispatch:   # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write
  pages: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch headlines and curate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python scripts/update.py

      - name: Commit changes
        run: |
          git config user.name  "market-pulse-bot"
          git config user.email "market-pulse-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: daily news update $(date -u +%F)"
            git push
          fi

      - name: Trigger GitHub Pages rebuild (safety net)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
